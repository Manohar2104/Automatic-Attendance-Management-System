<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance - BLE Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131a2e;
            --bg-tertiary: #1b2541;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --color-success: #10b981;
            --color-warning: #f59e0b;
            --color-error: #ef4444;
            --color-border: #2d3a5a;
            --font-main: 'Outfit', sans-serif;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.5);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--color-border);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--accent-primary), #6366f1);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .logo-title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            font-family: var(--font-main);
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--color-border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--bg-tertiary);
        }

        .btn-small {
            padding: 0.45rem 0.75rem;
            font-size: 0.85rem;
        }

        .input-field {
            font-family: var(--font-main);
            width: 100%;
            background-color: var(--bg-primary);
            border: 1px solid var(--color-border);
            border-radius: 0.5rem;
            padding: 0.6rem 0.75rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .login-wrapper {
            max-width: 450px;
            width: 100%;
            margin: 5rem auto;
            padding: 0 1rem;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 0.65rem;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        main {
            flex: 1;
            padding: 1.5rem;
            max-width: 1500px;
            width: 100%;
            margin: 0 auto;
            display: grid;
            gap: 1.5rem;
        }

        .layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1100px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .sessions-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .session-item {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--color-border);
            border-radius: 0.75rem;
            padding: 0.9rem;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            align-items: center;
        }

        .session-item:hover {
            border-color: var(--accent-primary);
            transform: translateY(-1px);
        }

        .session-item.selected {
            border-color: var(--accent-primary);
            background-color: rgba(59, 130, 246, 0.08);
        }

        .session-meta h4 {
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .session-meta p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.35;
        }

        .badge {
            padding: 0.3rem 0.65rem;
            border-radius: 2rem;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .badge-active {
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            background-color: rgba(16, 185, 129, 0.12);
        }

        .badge-ended {
            color: #9ca3af;
            border: 1px solid rgba(107, 114, 128, 0.35);
            background-color: rgba(107, 114, 128, 0.12);
        }

        .badge-cancelled {
            color: #fda4af;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background-color: rgba(239, 68, 68, 0.12);
        }

        .content-grid {
            display: grid;
            grid-template-rows: auto auto auto;
            gap: 1rem;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        @media (max-width: 1000px) {
            .summary-grid {
                grid-template-columns: repeat(2, minmax(140px, 1fr));
            }
        }

        .metric {
            background: var(--bg-tertiary);
            border: 1px solid var(--color-border);
            border-radius: 0.7rem;
            padding: 0.7rem;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 0.7rem 0.8rem;
            border-bottom: 2px solid var(--color-border);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
        }

        td {
            padding: 0.75rem 0.8rem;
            border-bottom: 1px solid var(--color-border);
            font-size: 0.88rem;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .status-present { color: var(--color-success); font-weight: 600; }
        .status-missing { color: var(--color-error); font-weight: 600; }
        .status-unknown { color: var(--text-secondary); font-weight: 600; }

        .section-state {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .section-state.error {
            color: #fda4af;
        }

        .section-state .retry {
            margin-top: 0.75rem;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .top-controls span {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--color-border);
            border-left: 4px solid var(--accent-primary);
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition-smooth);
            max-width: 320px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            <div class="logo-icon">BLE</div>
            <div class="logo-title">Smart Attendance BLE Dashboard</div>
        </div>
        <div class="user-controls" id="header-auth-controls" style="display:none;">
            <div class="top-controls">
                <span>Refresh (sec)</span>
                <input id="refresh-seconds" class="input-field" type="number" min="5" max="120" value="10" style="width:84px; padding:0.4rem 0.55rem;">
                <button class="btn btn-secondary btn-small" onclick="applyRefreshInterval()">Apply</button>
            </div>
            <span id="user-display" style="color: var(--text-secondary); font-size: 0.9rem;"></span>
            <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
    </header>

    <div id="login-view" class="login-wrapper">
        <div class="card">
            <div class="card-title">Portal Login</div>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="email">Admin or Faculty Email</label>
                    <input class="input-field" type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input class="input-field" type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width:100%; margin-top:1rem;">Authenticate</button>
            </form>
        </div>
    </div>

    <main id="app-view" style="display:none;">
        <div class="layout">
            <section class="card">
                <div class="card-title">
                    <span>BLE Sessions</span>
                    <button class="btn btn-secondary btn-small" onclick="fetchSessions()">Refresh</button>
                </div>
                <div id="sessions-list" class="sessions-container"></div>
            </section>

            <section class="content-grid">
                <div class="card">
                    <div class="card-title">Session Summary</div>
                    <div id="session-summary"></div>
                </div>

                <div class="card">
                    <div class="card-title">Live Observations</div>
                    <div id="observations-content"></div>
                </div>

                <div class="card">
                    <div class="card-title">Presence</div>
                    <div id="presence-content"></div>
                </div>
            </section>
        </div>
    </main>

    <div id="toast" class="toast"></div>

    <script>
        let currentToken = null;
        let selectedSessionId = null;
        let selectedSession = null;
        let refreshTimer = null;
        let refreshMs = 10000;
        let sessionsCache = [];
        let latestObservationByStudent = new Map();

        window.addEventListener('load', () => {
            const token = localStorage.getItem('jwt_token');
            const email = localStorage.getItem('user_email');
            if (token) {
                currentToken = token;
                showApp(email);
                fetchSessions();
                syncActiveSessionSelection();
                startRefreshLoop();
            }
            renderEmpty('sessions-list', 'No sessions loaded.');
            renderEmpty('session-summary', 'Select a BLE session to view summary.');
            renderEmpty('observations-content', 'Select a BLE session to view observations.');
            renderEmpty('presence-content', 'Select a BLE session to view presence records.');
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.borderLeftColor = isError ? 'var(--color-error)' : 'var(--accent-primary)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function showApp(email) {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'grid';
            document.getElementById('header-auth-controls').style.display = 'flex';
            document.getElementById('user-display').innerText = email || '';
        }

        function showLogin() {
            document.getElementById('login-view').style.display = 'block';
            document.getElementById('app-view').style.display = 'none';
            document.getElementById('header-auth-controls').style.display = 'none';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                if (!response.ok) {
                    const err = await safeJson(response);
                    showToast((err && err.detail) || 'Authentication failed', true);
                    return;
                }

                const data = await response.json();
                currentToken = data.access_token;
                localStorage.setItem('jwt_token', currentToken);
                localStorage.setItem('user_email', email);
                showApp(email);
                await fetchSessions();
                await syncActiveSessionSelection();
                startRefreshLoop();
                showToast('Authenticated successfully');
            } catch (_error) {
                showToast('Cannot connect to server', true);
            }
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_email');
            currentToken = null;
            selectedSessionId = null;
            selectedSession = null;
            sessionsCache = [];
            latestObservationByStudent = new Map();
            stopRefreshLoop();
            showLogin();
            renderEmpty('sessions-list', 'No sessions loaded.');
            renderEmpty('session-summary', 'Select a BLE session to view summary.');
            renderEmpty('observations-content', 'Select a BLE session to view observations.');
            renderEmpty('presence-content', 'Select a BLE session to view presence records.');
        }

        function applyRefreshInterval() {
            const value = Number(document.getElementById('refresh-seconds').value);
            if (!Number.isFinite(value) || value < 5 || value > 120) {
                showToast('Refresh interval must be between 5 and 120 seconds', true);
                return;
            }
            refreshMs = value * 1000;
            startRefreshLoop();
            showToast('Refresh interval updated');
        }

        function startRefreshLoop() {
            stopRefreshLoop();
            refreshTimer = setInterval(async () => {
                await syncActiveSessionSelection(false);
                if (!selectedSessionId) {
                    return;
                }
                await refreshActiveViews(false);
            }, refreshMs);
        }

        function stopRefreshLoop() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
        }

        async function apiGet(path) {
            const response = await fetch(path, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${currentToken}`,
                    'Accept': 'application/json',
                },
            });

            if (response.status === 401) {
                showToast('Session expired. Please login again.', true);
                logout();
                throw new Error('unauthorized');
            }

            if (!response.ok) {
                const err = await safeJson(response);
                const message = (err && err.detail) || `Request failed (${response.status})`;
                throw new Error(message);
            }

            return response.json();
        }

        async function safeJson(response) {
            try {
                return await response.json();
            } catch (_error) {
                return null;
            }
        }

        function renderLoading(targetId, text = 'Loading...') {
            const target = document.getElementById(targetId);
            target.innerHTML = `<div class="section-state">${text}</div>`;
        }

        function renderEmpty(targetId, text) {
            const target = document.getElementById(targetId);
            target.innerHTML = `<div class="section-state">${text}</div>`;
        }

        function renderError(targetId, text, retryFnName) {
            const target = document.getElementById(targetId);
            target.innerHTML = `
                <div class="section-state error">
                    <div>${text}</div>
                    <button class="btn btn-secondary btn-small retry" onclick="${retryFnName}()">Retry</button>
                </div>
            `;
        }

        function formatDateTime(value) {
            if (!value) {
                return '--';
            }
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return '--';
            }
            return date.toLocaleString();
        }

        function badgeForStatus(status) {
            const value = String(status || '').toUpperCase();
            if (value === 'ACTIVE') return 'badge badge-active';
            if (value === 'CANCELLED') return 'badge badge-cancelled';
            return 'badge badge-ended';
        }

        function normalizeSession(raw) {
            return {
                id: raw.session_id,
                session_id: raw.session_id,
                course_id: raw.course_id,
                teacher_id: raw.teacher_id,
                status: raw.status,
                start_time: raw.start_time,
                end_time: raw.end_time,
                room: raw.room,
                attendance_mode: raw.attendance_mode,
            };
        }

        async function fetchSessions() {
            renderLoading('sessions-list', 'Loading BLE sessions...');
            try {
                const payload = await apiGet('/api/ble/sessions');
                sessionsCache = (payload.sessions || []).map(normalizeSession);
                renderSessions(sessionsCache);
                if (selectedSessionId) {
                    const found = sessionsCache.find(session => session.id === selectedSessionId);
                    if (!found) {
                        selectedSessionId = null;
                        selectedSession = null;
                        renderEmpty('session-summary', 'Select a BLE session to view summary.');
                        renderEmpty('observations-content', 'Select a BLE session to view observations.');
                        renderEmpty('presence-content', 'Select a BLE session to view presence records.');
                    } else {
                        selectedSession = found;
                    }
                }
                await syncActiveSessionSelection(false);
            } catch (error) {
                renderError('sessions-list', error.message || 'Failed to load sessions', 'fetchSessions');
            }
        }

        async function syncActiveSessionSelection(showLoading = true) {
            try {
                const payload = await apiGet('/api/ble/dashboard');
                if (!payload || !payload.session || !payload.session.session_id) {
                    return;
                }

                const activeSessionId = payload.session.session_id;
                if (selectedSessionId === activeSessionId) {
                    return;
                }

                selectedSessionId = activeSessionId;
                selectedSession = sessionsCache.find(session => session.id === activeSessionId) || null;
                renderSessions(sessionsCache);
                await refreshActiveViews(showLoading);
            } catch (error) {
                console.warn('Unable to sync active session', error);
            }
        }

        function renderSessions(sessions) {
            const target = document.getElementById('sessions-list');
            if (!sessions || sessions.length === 0) {
                renderEmpty('sessions-list', 'No BLE sessions found.');
                return;
            }

            const sorted = [...sessions].sort((a, b) => new Date(b.start_time) - new Date(a.start_time));
            target.innerHTML = sorted.map(session => {
                const isSelected = selectedSessionId === session.id ? 'selected' : '';
                return `
                    <div class="session-item ${isSelected}" data-session-id="${session.id}">
                        <div class="session-meta">
                            <h4>${session.course_id}</h4>
                            <p>Session: ${session.id}</p>
                            <p>Teacher: ${session.teacher_id}</p>
                            <p>Room: ${session.room || '--'}</p>
                            <p>Start: ${formatDateTime(session.start_time)}</p>
                            <p>End: ${formatDateTime(session.end_time)}</p>
                        </div>
                        <span class="${badgeForStatus(session.status)}">${session.status}</span>
                    </div>
                `;
            }).join('');

            target.querySelectorAll('.session-item').forEach(item => {
                item.addEventListener('click', () => {
                    const sessionId = item.getAttribute('data-session-id');
                    selectSession(sessionId);
                });
            });
        }

        async function selectSession(sessionId) {
            if (!sessionId) {
                return;
            }
            if (selectedSessionId === sessionId) {
                return;
            }

            selectedSessionId = sessionId;
            selectedSession = sessionsCache.find(session => session.id === sessionId) || null;
            renderSessions(sessionsCache);
            await refreshActiveViews(true);
        }

        async function refreshActiveViews(showLoading) {
            if (!selectedSessionId) {
                return;
            }

            if (showLoading) {
                renderLoading('session-summary', 'Loading summary...');
                renderLoading('observations-content', 'Loading observations...');
                renderLoading('presence-content', 'Loading presence...');
            }

            try {
                const [summary, observations, presence] = await Promise.all([
                    apiGet(`/api/ble/session/${selectedSessionId}/summary`),
                    apiGet(`/api/ble/session/${selectedSessionId}/observations`),
                    apiGet(`/api/ble/session/${selectedSessionId}/presence`),
                ]);

                renderSessionSummary(summary);
                renderObservations(observations);
                renderPresence(presence, observations);
            } catch (error) {
                renderError('session-summary', error.message || 'Failed to load summary', 'retrySelectedSession');
                renderError('observations-content', error.message || 'Failed to load observations', 'retrySelectedSession');
                renderError('presence-content', error.message || 'Failed to load presence', 'retrySelectedSession');
            }
        }

        async function retrySelectedSession() {
            await refreshActiveViews(true);
        }

        function renderSessionSummary(payload) {
            const target = document.getElementById('session-summary');
            if (!payload || !payload.session) {
                renderEmpty('session-summary', 'No summary available for the selected session.');
                return;
            }

            target.innerHTML = `
                <div class="summary-grid">
                    <div class="metric"><div class="metric-label">Session ID</div><div class="metric-value">${payload.session.session_id || '--'}</div></div>
                    <div class="metric"><div class="metric-label">Course</div><div class="metric-value">${payload.session.course_id || '--'}</div></div>
                    <div class="metric"><div class="metric-label">Teacher</div><div class="metric-value">${payload.session.teacher_id || '--'}</div></div>
                    <div class="metric"><div class="metric-label">Room</div><div class="metric-value">${payload.session.room || '--'}</div></div>
                    <div class="metric"><div class="metric-label">Status</div><div class="metric-value">${payload.session.status || '--'}</div></div>
                    <div class="metric"><div class="metric-label">Start Time</div><div class="metric-value">${formatDateTime(payload.session.start_time)}</div></div>
                    <div class="metric"><div class="metric-label">End Time</div><div class="metric-value">${formatDateTime(payload.session.end_time)}</div></div>
                    <div class="metric"><div class="metric-label">Attendance Mode</div><div class="metric-value">${payload.session.attendance_mode || '--'}</div></div>
                    <div class="metric"><div class="metric-label">Registered Students</div><div class="metric-value">${payload.registered_students ?? '--'}</div></div>
                    <div class="metric"><div class="metric-label">Detected Students</div><div class="metric-value">${payload.detected_students ?? '--'}</div></div>
                    <div class="metric"><div class="metric-label">Present</div><div class="metric-value">${payload.present ?? '--'}</div></div>
                    <div class="metric"><div class="metric-label">Missing</div><div class="metric-value">${payload.missing ?? '--'}</div></div>
                    <div class="metric"><div class="metric-label">Absent</div><div class="metric-value">${payload.absent ?? 'N/A'}</div></div>
                    <div class="metric"><div class="metric-label">Late</div><div class="metric-value">${payload.late ?? 'N/A'}</div></div>
                    <div class="metric"><div class="metric-label">Latest Observation</div><div class="metric-value">${formatDateTime(payload.latest_observation)}</div></div>
                    <div class="metric"><div class="metric-label">Average RSSI</div><div class="metric-value">${payload.average_rssi ?? '--'}</div></div>
                </div>
            `;
        }

        function renderObservations(payload) {
            const target = document.getElementById('observations-content');
            const observations = (payload && payload.observations) || [];

            latestObservationByStudent = new Map();
            observations.forEach(item => {
                latestObservationByStudent.set(item.student_id, item);
            });

            if (observations.length === 0) {
                renderEmpty('observations-content', 'No observations available for this session.');
                return;
            }

            target.innerHTML = `
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Student Name</th>
                                <th>Anonymous BLE ID</th>
                                <th>RSSI</th>
                                <th>Last Seen</th>
                                <th>Advertisement Count</th>
                                <th>Observation Timestamp</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${observations.map(item => `
                                <tr>
                                    <td>${item.student_name || item.student_id || '--'}</td>
                                    <td>${item.anonymous_ble_id || '--'}</td>
                                    <td>${item.rssi ?? '--'}</td>
                                    <td>${formatDateTime(item.last_seen)}</td>
                                    <td>${item.advertisement_count ?? '--'}</td>
                                    <td>${formatDateTime(item.observation_timestamp)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderPresence(payload, observationsPayload) {
            const target = document.getElementById('presence-content');
            const records = (payload && payload.records) || [];

            if (records.length === 0) {
                renderEmpty('presence-content', 'No presence records available for this session.');
                return;
            }

            target.innerHTML = `
                <div style="margin-bottom:0.75rem; color:var(--text-secondary); font-size:0.85rem;">
                    Present: ${payload.summary?.present ?? '--'} | Missing: ${payload.summary?.missing ?? '--'} | Absent: ${payload.summary?.absent ?? 'N/A'} | Late: ${payload.summary?.late ?? 'N/A'}
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Current Status</th>
                                <th>Last Seen</th>
                                <th>RSSI</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${records.map(record => {
                                const observation = latestObservationByStudent.get(record.student_id);
                                const statusClass = record.status === 'PRESENT' ? 'status-present' : (record.status === 'MISSING' ? 'status-missing' : 'status-unknown');
                                return `
                                    <tr>
                                        <td>${record.student_name || record.student_id || '--'}</td>
                                        <td><span class="${statusClass}">${record.status || '--'}</span></td>
                                        <td>${formatDateTime(record.last_seen)}</td>
                                        <td>${observation ? observation.rssi : '--'}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
    </script>
</body>
</html>
